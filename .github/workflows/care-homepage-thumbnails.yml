name: CARE official homepage thumbnails
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - editorial-care.json
      - data.json
      - scripts/capture-care-homepages.py
      - .github/workflows/care-homepage-thumbnails.yml
permissions:
  contents: write
concurrency:
  group: care-homepage-thumbnails
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0
          python -m playwright install chromium --with-deps
      - name: Capture each provider official homepage
        run: python scripts/capture-care-homepages.py
      - name: Commit successful provider-specific screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/editorial-thumbnails/care/
          if git diff --cached --quiet; then
            echo "No new homepage screenshots"
          else
            git commit -m "Add CARE provider-specific official homepage previews"
            git push
          fi
