name: Validate MATE hourly GAS phase simulation (no send)

on:
  pull_request:
    paths:
      - "scripts/mate_auto_ops_v4.gs"
      - "scripts/ci/mate-gas-sliced-cycle.test.mjs"
      - ".github/workflows/check-mate-gas-phases.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify phase 0/1/2 without calls to Gmail or Google Apps Script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run exact phase simulation used by protected GAS production sync
        run: node --test scripts/ci/mate-gas-sliced-cycle.test.mjs
