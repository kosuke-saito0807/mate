name: Check MATE 3-site public indexability (read only)

on:
  pull_request:
    paths:
      - "scripts/check_three_site_indexability.py"
      - "tests/test_three_site_indexability.py"
      - "tests/test_care_play_crosslinks.py"
      - "sitter-directory.html"
      - "spark/school-directory.html"
      - "guide-infant-babysitter-first-use.html"
      - "spark/guide-lessons-age-three.html"
      - "index.html"
      - "guides.html"
      - "guide-weekend-family-event.html"
      - "guide-family-outing.html"
      - "guide-baby-outing-prep.html"
      - "llms.txt"
      - ".github/workflows/check-three-site-indexability.yml"
  push:
    branches: [main]
    paths:
      - "scripts/check_three_site_indexability.py"
      - "tests/test_three_site_indexability.py"
      - "tests/test_care_play_crosslinks.py"
      - ".github/workflows/check-three-site-indexability.yml"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mate-public-indexability-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test indexability monitor (offline)
        run: python3 -m unittest discover -s tests -p "test_three_site_indexability.py" -v
      - name: Verify contextual cross-service discovery links (offline)
        run: python3 -m unittest discover -s tests -p "test_care_play_crosslinks.py" -v
      - name: Inspect real CARE, SPARK and PLAY public HTTPS pages
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p artifacts
          set +e
          python3 scripts/check_three_site_indexability.py > artifacts/three-site-indexability.json
          check_exit=$?
          cat artifacts/three-site-indexability.json
          exit "$check_exit"
      - name: Save diagnostics when there is a crawlability regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-indexability-report
          path: artifacts/three-site-indexability.json
          if-no-files-found: ignore
          retention-days: 14
