name: Deploy MATE SPARK to Firebase Hosting (free)

on:
  push:
    branches: [main]
    paths:
      - "spark/**"
      - "firebase.json"
      - "tests/test_spark*.py"
      - "tests/test_mate_nationwide.py"
      - "tests/test_mate_launch_preparation.py"
      - "tests/test_mate_owner_self_service.py"
      - "scripts/sync_spark_public.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-mate-spark-live
  cancel-in-progress: true

jobs:
  deploy:
    # Fail closed until project owner configures scoped Firebase Hosting credentials.
    if: ${{ vars.MATE_FIREBASE_AUTO_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test Firebase publication rules
        run: |
          python3 -m unittest discover -s tests -p 'test_spark*.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_nationwide.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_launch_preparation.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_owner_self_service.py' -v
          python3 -m json.tool spark/schools.json >/dev/null
          python3 -m json.tool spark/demo-schools.json >/dev/null
          python3 -m json.tool firebase.json >/dev/null
      - name: Deploy standalone SPARK to Firebase live site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MATE_SPARK }}
          projectId: mate-spark
          channelId: live
