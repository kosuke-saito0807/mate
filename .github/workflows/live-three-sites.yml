name: MATE live 3-site desktop/mobile audit (read only)

on:
  pull_request:
    paths:
      - "tests/live_three_sites.cjs"
      - ".github/workflows/live-three-sites.yml"
      - "*.html"
      - "spark/**"
      - "assets/**"
  push:
    branches: [main]
    paths:
      - "tests/live_three_sites.cjs"
      - ".github/workflows/live-three-sites.yml"
      - "*.html"
      - "spark/**"
      - "assets/**"
  schedule:
    - cron: "0 0 * * 1"  # Monday 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mate-three-site-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Playwright (browser used only for reads)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Review 3 live websites, desktop and mobile; never submit forms
        run: node tests/live_three_sites.cjs
      - name: Save read-only screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mate-three-sites-live-audit
          path: artifacts/live-audit/
          if-no-files-found: ignore
          retention-days: 7
