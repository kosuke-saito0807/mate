name: CARE PLAY direct intake release checks

on:
  pull_request:
    paths:
      - 'contact.html'
      - 'play-listing.html'
      - 'assets/mate-direct-intake*.js'
      - 'scripts/mate_direct_intake.gs'
      - 'tests/test_mate_direct_intake.cjs'
      - '.github/workflows/mate-direct-care-play-release-ci.yml'
  push:
    branches: [main]
    paths:
      - 'contact.html'
      - 'play-listing.html'
      - 'assets/mate-direct-intake*.js'
      - 'scripts/mate_direct_intake.gs'
      - 'tests/test_mate_direct_intake.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-intake-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate actual Google Apps Script logic using isolated mocks
        run: node tests/test_mate_direct_intake.cjs
      - name: Verify CARE and PLAY submit only to reviewed endpoint
        run: |
          node --check assets/mate-direct-intake.js
          node --check assets/mate-direct-intake-config.js
          python3 - <<'PY'
          from pathlib import Path
          cfg=Path('assets/mate-direct-intake-config.js').read_text()
          assert 'enabled: true' in cfg
          assert 'script.google.com/macros/s/AKfycbxpUkZ4tS5sZbZo6aan5urZF_p3eGAUPRRsZIw_H-ogz3wP3s9_vqKx5dWce_psf3iK/exec' in cfg
          assert 'siteKey: "0x4AAAAAAFj7hqLVxtwrjKAM"' in cfg
          assert 'MATE_TURNSTILE_SECRET' not in cfg
          for name in ['contact.html','play-listing.html']:
              text=Path(name).read_text()
              assert 'data-mate-direct-listing="true"' in text, name
              assert 'mate-direct-intake-config.js' in text, name
              assert 'mate-direct-intake.js' in text, name
              assert 'action="https://formsubmit.co/' not in text, name
              assert '<script src="assets/contact.js' not in text, name
          for name in ['consult.html','spark/partners.html']:
              assert Path(name).exists()
          print('CARE/PLAY direct intake configured, no legacy listing delivery or secrets')
          PY
