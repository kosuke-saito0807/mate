name: MATE approved photo Drive API activation (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mate-drive-api-enable-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drive-api:
    name: Enable only approved-media Google Drive API when authorized
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet google-auth requests
      - name: Validate publisher identity and request only Drive API
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, sys, time
          from google.oauth2.service_account import Credentials
          from google.auth.transport.requests import AuthorizedSession
          raw=os.environ.get('GOOGLE_SERVICE_ACCOUNT_JSON','')
          if not raw:
              raise SystemExit('ERROR: No approved-media service-account secret.')
          info=json.loads(raw)
          email=str(info.get('client_email') or '').strip().lower()
          fingerprint=hashlib.sha256(email.encode()).hexdigest()[:16]
          assert fingerprint=='e77d390ba84d37d4','ERROR: Publisher identity mismatch; refusing unrelated project changes.'
          project=str(info.get('project_id') or '')
          assert re.fullmatch(r'[a-z][a-z0-9-]{5,62}',project),'ERROR: Invalid project identifier.'
          credentials=Credentials.from_service_account_info(info,scopes=['https://www.googleapis.com/auth/cloud-platform'])
          session=AuthorizedSession(credentials)
          path='https://serviceusage.googleapis.com/v1/projects/'+project+'/services/drive.googleapis.com'
          try:
              response=session.post(path+':enable',timeout=25)
          except Exception:
              print('ERROR: Enable request could not be completed; no other API was touched.')
              sys.exit(1)
          if response.status_code not in (200,201):
              try:
                  status=str(response.json().get('error',{}).get('status','unknown'))
              except (ValueError,AttributeError):
                  status='unknown'
              if not re.fullmatch(r'[A-Za-z_]{1,55}',status):
                  status='unknown'
              print('ERROR: Drive API activation not authorized. HTTP',response.status_code,'status',status)
              print('A Google Cloud project owner must enable Drive API in APIs & Services > Library.')
              sys.exit(1)
          print('SUCCESS: Requested enablement of Google Drive API on the verified publication project, and no other APIs.')
          for attempt in range(6):
              time.sleep(3)
              try:
                  check=session.get(path,timeout=12)
                  if check.status_code==200 and check.json().get('state')=='ENABLED':
                      print('SUCCESS: Google Drive API is ENABLED.')
                      sys.exit(0)
              except Exception:
                  pass
          print('NOTICE: Operation accepted, activation status pending. Next media sync will verify.')
          PY
