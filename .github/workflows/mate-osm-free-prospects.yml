name: MATE OSM candidate discovery (read-only, ODbL)

on:
  pull_request:
    paths:
      - 'scripts/collect_osm_discovery.py'
      - 'scripts/ci/test_collect_osm_discovery.py'
      - 'data/mate_osm_discovery_README.md'
      - '.github/workflows/mate-osm-free-prospects.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/collect_osm_discovery.py'
      - 'scripts/ci/test_collect_osm_discovery.py'
      - 'data/mate_osm_discovery_README.md'
      - '.github/workflows/mate-osm-free-prospects.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 12 * * *'

permissions:
  contents: read

concurrency:
  group: mate-osm-bounded-open-data
  cancel-in-progress: false

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded ODbL discovery and no send capability (NO NETWORK)
        run: python -m unittest discover -s scripts/ci -p test_collect_osm_discovery.py -v

  discover:
    permissions:
      contents: write
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check safety tests before live OSM request
        run: python -m unittest discover -s scripts/ci -p test_collect_osm_discovery.py -v
      - name: Query exactly two small OSM areas (READ-ONLY, no email/form submission)
        run: python scripts/collect_osm_discovery.py
      - name: Enforce ODbL record attribution and review-only status
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          for filename in ('data/mate_osm_discovery.csv', 'data/mate_osm_recent.csv'):
              with Path(filename).open(encoding='utf-8', newline='') as f:
                  for row in csv.DictReader(f):
                      assert row['service'] in ('CARE', 'SPARK', 'PLAY')
                      assert row['mail_basis'] == 'UNVERIFIED'
                      assert not row['email'] and not row['contact_url']
                      assert row['source_url'].startswith('https://www.openstreetmap.org/')
                      assert row['website'].startswith('https://')
          assert 'OpenStreetMap' in Path('data/mate_osm_discovery_README.md').read_text()
          PY
      - name: Save only changed separate review-only OSM feed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/mate_osm_discovery.csv data/mate_osm_recent.csv && \
             [ -f data/mate_osm_discovery.csv ]; then
            echo "No new OSM candidates"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mate_osm_discovery.csv data/mate_osm_recent.csv
          if git diff --cached --quiet; then
            echo "No new OSM candidates"
            exit 0
          fi
          git commit -m "data(growth): update separate ODbL OpenStreetMap discovery candidates"
          git push
