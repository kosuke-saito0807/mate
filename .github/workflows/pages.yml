name: Deploy MATE SITTER to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync MATE SITTER public data from Google Sheets"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Test MATE SPARK publication safeguards
        run: |
          python3 -m unittest discover -s tests -p "test_spark*.py" -v
          python3 -m unittest discover -s tests -p "test_mate_nationwide.py" -v
          python3 -m unittest discover -s tests -p "test_mate_launch_preparation.py" -v
          python3 -m unittest discover -s tests -p "test_mate_owner_self_service.py" -v
          python3 -m unittest discover -s tests -p 'test_family_consultation.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_seo.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_ai_release.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_organic_consultation.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_business_acquisition.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_intake_notification_safety.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_listing_pipeline_health.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_ga4.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_social.py' -v
          python3 -m unittest discover -s tests -p 'test_play_public_link_cutover.py' -v
          python3 -m unittest discover -s tests -p 'test_discoverability_ux.py' -v
          python3 -m unittest discover -s tests -p 'test_public_data_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_owner_publication_rehearsal.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_sales_quality.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_outreach_no_bcc.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_codecamp_suppression.py' -v
          python3 -m unittest discover -s tests -p 'test_listing_terms_gate.py' -v
          python3 -m json.tool spark/schools.json >/dev/null
          python3 -m json.tool spark/config.json >/dev/null
      - uses: actions/configure-pages@v5
      - name: Package public site only
        run: |
          mkdir -p _site
          cp *.html data.json robots.txt sitemap.xml llms.txt favicon.svg favicon.ico _site/
          cp -R assets _site/assets
          cp -R spark _site/spark
          find _site/spark -type f -name '*.md' -delete
      - name: Stamp deployed CARE release for support checks
        run: |
          python3 - <<'PY'
          import datetime,json,pathlib,subprocess
          sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          output={"service":"CARE","source_commit":sha,"deployed_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"repository":"kosuke-saito0807/mate"}
          pathlib.Path("_site/release.json").write_text(json.dumps(output,ensure_ascii=False,separators=(",",":"))+"\n",encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify CARE public release, intake and SEO assets
        run: python3 scripts/check_live_release.py CARE "$(git rev-parse HEAD)"
