name: MATE public search indexability (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check_mate_search_indexability.py'
      - '.github/workflows/search-indexability.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/check_mate_search_indexability.py'
      - '.github/workflows/search-indexability.yml'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'spark/robots.txt'
      - 'spark/sitemap.xml'
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit public sitemap URLs without form submission
        run: python3 scripts/check_mate_search_indexability.py
