name: Sync MATE public data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build private CRM CSV
        env:
          MATE_CRM_CSV: ${{ secrets.MATE_CRM_CSV }}
        run: |
          printf '%s' "$MATE_CRM_CSV" > /tmp/mate_crm.csv

      - name: Build public data.json
        env:
          CRM_CSV: /tmp/mate_crm.csv
          PUBLIC_JSON: data.json
        run: python3 scripts/build_public_data.py

      - name: Commit public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Sync approved MATE providers"
          git push
