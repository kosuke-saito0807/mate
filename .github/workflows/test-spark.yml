name: Validate MATE SPARK changes

on:
  pull_request:
    paths:
      - "spark/**"
      - "scripts/sync_spark_public.py"
      - "tests/test_spark*.py"
      - "tests/test_mate_nationwide.py"
      - "tests/test_mate_launch_preparation.py"
      - "tests/test_mate_owner_self_service.py"
      - "scripts/sync_google_sheets_public.py"
      - "index.html"
      - "contact.html"
      - "assets/contact.js"
      - "tests/test_mate_owner_self_service.py"
      - "scripts/sync_google_sheets_public.py"
      - "privacy.html"
      - "assets/provider-search.js"
      - "firebase.json"
  push:
    branches: [main]
    paths:
      - "spark/**"
      - "scripts/sync_spark_public.py"
      - "tests/test_spark*.py"
      - "tests/test_mate_nationwide.py"
      - "tests/test_mate_launch_preparation.py"
      - "tests/test_mate_owner_self_service.py"
      - "scripts/sync_google_sheets_public.py"
      - "index.html"
      - "contact.html"
      - "assets/contact.js"
      - "tests/test_mate_owner_self_service.py"
      - "scripts/sync_google_sheets_public.py"
      - "privacy.html"
      - "assets/provider-search.js"
      - "firebase.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify static data and deployment settings
        run: |
          python3 -m json.tool spark/schools.json >/dev/null
          python3 -m json.tool spark/demo-schools.json >/dev/null
          python3 -m json.tool spark/config.json >/dev/null
          python3 -m json.tool firebase.json >/dev/null
      - name: Run consent, privacy and original-site parity checks
        run: |
          python3 -m unittest discover -s tests -p 'test_spark*.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_nationwide.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_launch_preparation.py' -v
          python3 -m unittest discover -s tests -p 'test_mate_owner_self_service.py' -v
