name: Verify published CARE four-card layout and SPARK TLS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy MATE SITTER to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "40 3 * * *"

permissions:
  contents: read

jobs:
  production-check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Verify actual public CARE markup, photo assets and SPARK TLS
        run: python3 scripts/verify_mate_production_scene_tls.py
